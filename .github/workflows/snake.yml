name: Generate Snake Animation

on:
  schedule:
    # Executa todos os dias às 00:00 UTC (21:00 no horário de Brasília)
    - cron: "0 0 * * *"
  
  # Permite disparar o workflow manualmente pela aba Actions do GitHub
  workflow_dispatch:
  
  # Executa sempre que houver push na branch main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Gera a animação da cobrinha em SVG (versão clara e versão escura)
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Faz commit e push automático dos arquivos da pasta dist para a branch 'output'
      - name: Push Snake Animation to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
